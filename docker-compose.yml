version: '3.8'

services:
  # Audimodal main application
  audimodal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audimodal-app
    ports:
      - "8084:8080"
    environment:
      - EAI_ENV=development
      - LOG_LEVEL=info
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=audimodal
      - DB_USERNAME=audimodal-admin
      - DB_PASSWORD=eaipassword
      - DB_AUTO_MIGRATE=true
      - EAI_REDIS_HOST=redis-shared
      - EAI_REDIS_PORT=6379
      - JWT_SECRET=your-jwt-secret-change-in-production
      - AUTH_ENABLED=false
      - EAI_ENCRYPTION_KEY=your-32-byte-encryption-key-here
      - EAI_STORAGE_LOCAL_PATH=/app/data/storage
      - EAI_TEMP_DIR=/app/temp
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPLAKE_API_URL=http://deeplake-api_deeplake-service_1:8000
      - DEEPLAKE_API_KEY=${DEEPLAKE_API_KEY:-}
      # MinIO/S3 Configuration for local development
      - AWS_ENDPOINT_URL=http://minio-shared:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_REGION=us-east-1
      - AWS_S3_BUCKET=audimodal-uploads
      - AWS_S3_FORCE_PATH_STYLE=true
      - S3_UPLOAD_EXPIRATION=3600
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
    depends_on:
      - postgres
    networks:
      - tas-shared-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: audimodal-postgres
    environment:
      - POSTGRES_DB=audimodal
      - POSTGRES_USER=audimodal-admin
      - POSTGRES_PASSWORD=eaipassword
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - tas-shared-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audimodal-admin -d audimodal"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
    driver: local

networks:
  tas-shared-network:
    external: true